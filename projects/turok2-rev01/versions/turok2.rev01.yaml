name: Turok 2 - Seeds of Evil (US Rev.01 / crash-screen rebuild)
sha1: f005a571471602ceaa8f15b45e834d0d5ba19261

options:
  basename: turok2
  base_path: ..
  target_path: baserom.z64
  src_path: src
  asm_path: asm
  symbol_addrs_path:
    - versions/symbol_addrs.rev01.txt
  undefined_funcs_auto_path: versions/undefined_funcs_auto.rev01.txt
  undefined_syms_auto_path: versions/undefined_syms_auto.rev01.txt

  compiler: SN64
  platform: n64
  subalign: 1
  find_file_boundaries: True
  use_legacy_include_asm: False
  generated_c_preamble: "#include \"include_asm.h\""
  generated_s_preamble: ".set fp=64"

# First-pass map measured from this ROM. Do not copy US 1.0 offsets.
# Engine still TLB-maps at vaddr 0x00200000 (boot stub is the US 1.0 stub
# except the jalr target, which is 0x00274FD0 instead of 0x0028D380).
segments:
  - name: header
    type: header
    start: 0x0

  - name: boot
    type: bin
    start: 0x40

  - name: main
    type: code
    align: 1
    start: 0x1000
    vram: 0x80000400
    subsegments:
      - [0x1000, asm]

  - name: code
    type: code
    align: 1
    start: 0x1100
    vram: 0x00200500
    subsegments:
      - [0x1100, asm]

  # The last engine `jr $ra` delay slot is 0x8A4C0, but the function does not
  # end there: func_00289870 (u64 -> float) has a second path at 0x002898C4
  # that masks the low word, sets the rounding bit and branches back with
  # `beq $0, $0, -68`. Those three instructions are code at ROM 0x8A4C4.
  # Strings ("header\0texture\0...") really begin at 0x8A4D0. Cutting at
  # 0x8A4C4 orphaned the tail and forced a stub that returned a garbage float.
  - name: code_rodata
    type: code
    align: 1
    start: 0x8A4D0
    vram: 0x800898D0
    subsegments:
      - [0x8A4D0, rodata]

  # rspboot/aspMain, then KSEG0 jump tables (ROM R → 0x80000000+R-0x400).
  - name: ucode
    type: bin
    start: 0x9F35C
    vram: 0x8009E75C

  # Engine jals into 0x004xxxxx resolve here: ROM = 0xA30D0 + (vram - 0x00400000).
  # 44/68 unique targets are addiu-sp prologues; the rest are leaves (lui/lw).
  # Last jr $ra delay is 0xC7A80. Vtables after that (0x0042FC60) are
  # still this bank: boot DMA ends at ROM 0xD3DB8. Not a second VRAM.
  - name: virtual
    type: code
    align: 1
    start: 0xA30D0
    vram: 0x00400000
    subsegments:
      - [0xA30D0, asm]

  - name: virtual_data
    type: bin
    start: 0xC7A84
    vram: 0x004249B4

  - name: rest
    type: bin
    start: 0xD3DB8

  - [0x2000000]
