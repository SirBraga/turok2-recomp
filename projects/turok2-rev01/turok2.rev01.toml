# Smoke-test N64Recomp config for the Rev.01 / crash-screen rebuild.
# Does not replace projects/turok2-decomp/turok2.us.toml.

[input]
# Boot stub is CP0/TLB. Host runtime must call 0x00274FD0, same idea as
# US 1.0 skipping boot_main and entering entry_0028D380.
rom_file_path = "baserom.z64"
symbols_file_path = "turok2.rev01.syms.toml"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# Only functions whose MIPS contains ops N64Recomp cannot emit:
# mfc0/mtc0 other than Status (12), teq/tge/tlt family, CACHE.
# Refresh with tools/refresh-stubs.py. Do not mass-stub Failed to analyze.
# Do not copy this list into the US 1.0 port.
stubs = [
    "func_00283810",
    "func_00287B00",
    "func_0041BBE0",
    "func_80000400",
    "func_80000488",
    "func_00276230",
    "func_002762B0",
    "func_00281640",
    "func_00281F40",
    "func_002834F0",
    "func_00283670",
    "func_00283740",
    "func_00283820",
    "func_00287ABC",
    "func_00287AD8",
    "func_00287B0C",
    "func_00287B90",
    "func_00287D68",
    "func_002880DC",
]
# __osSiRawStartDma / __osSiDeviceBusy. Host completes the 64-byte PIF
# transfer; the generated copies wait on SI_STATUS (0xA4800018).
ignored = [
    "func_0027FA30",
    "func_0027FAF0",
]

# IDO/SN64 `teq $zero, $zero` asserts on error paths. N64Recomp cannot
# emit traps; nop them so the rest of the function is generated. Do not
# stub the whole gfx thread (func_00273790).
[[patches.instruction]]
func = "func_002734A0"
vram = 0x273728
value = 0x00000000

[[patches.instruction]]
func = "func_00273790"
vram = 0x273A54
value = 0x00000000

[[patches.instruction]]
func = "func_00275F58"
vram = 0x27605C
value = 0x00000000

# After `lhu $6, 0x526($s0)` in func_00268444. $a2 is gSPFogPosition min.
# Cap wrap (>=997). Do not force min=0; that saturates black fog.
[[patches.hook]]
func = "func_00268444"
before_vram = 0x00268A2C
text = """
    turok2_rev01_clamp_fog_min(rdram, ctx);
"""

# After `sw $a0, 0x4($a1)` of G_MTX_PROJECTION. $a0 is cam+0x368+frame,
# $s0 is the camera. Title P has sx/sy right and z/w in the wrong cells.
[[patches.hook]]
func = "func_00268444"
before_vram = 0x0026861C
text = """
    turok2_rev01_fix_projection(rdram, ctx);
"""

# End of guPerspectiveF, $s0 still points at the float 4x4.
[[patches.hook]]
func = "func_0027E1D0"
before_vram = 0x0027E338
text = """
    turok2_rev01_dump_perspf(rdram, ctx);
"""

# Mark glist, then after the closing pipesync drop G_TRI* so title 2D
# can be tested without the 3D pass. Env TUROK2_STRIP_TRIS=1 only.
[[patches.hook]]
func = "func_00268444"
before_vram = 0x00268444
text = """
    turok2_rev01_mark_dl(rdram, ctx);
"""

[[patches.hook]]
func = "func_00268444"
before_vram = 0x00268C08
text = """
    turok2_rev01_strip_tris(rdram, ctx);
"""
