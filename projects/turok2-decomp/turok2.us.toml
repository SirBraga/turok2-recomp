# Unique 60 Hz Update/Draw (gNextTicks=1) for gameplay and cinema. Cinema
# currentTime is float seconds (increment * 1/15), so duration is unchanged.
# RT64 interpolation stays off. TUROK2_AUTHORED_CADENCE=1 restores the
# original 30/15 Hz scheduler. TUROK2_UNIQUE_120=1 is an opt-in test.
[[patches.hook]]
func = "func_00287ABC"
before_vram = 0x00288004
text = """
    turok2_patch_native_60(rdram, ctx);
"""

