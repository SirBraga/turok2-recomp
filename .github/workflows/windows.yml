name: Windows

# Produces a ready-to-run Windows build of Turok 2: Recompiled.
# Run it from the Actions tab (workflow_dispatch) or let it fire on a push.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # The recompiled C is roughly a thousand translation units, so a cold MSVC
    # build is long. The default 360 minute cap is not enough headroom to rely on.
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The dependencies under tools/ are vendored directly rather than
          # registered as submodules, because the port carries local changes to
          # N64ModernRuntime and RecompFrontend that upstream does not have.
          fetch-depth: 1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      # Speeds up repeat runs a lot; the first run populates it.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          variant: sccache
          key: turok2-windows

      - name: Configure
        run: >
          cmake -S projects/turok2-decomp -B build-win -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTUROK2_BUILD_APP=ON
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build-win --target Turok2Recompiled

      - name: Stage release folder
        shell: pwsh
        run: |
          $dist = "dist/Turok2Recompiled"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build-win/Turok2Recompiled.exe" $dist
          Copy-Item "build-win/*.dll" $dist -ErrorAction SilentlyContinue
          if (Test-Path "build-win/assets") {
            Copy-Item "build-win/assets" $dist -Recurse
          }
          if (Test-Path "projects/turok2-decomp/mods") {
            New-Item -ItemType Directory -Force -Path "$dist/mods" | Out-Null
            Copy-Item "projects/turok2-decomp/mods/*" "$dist/mods" -Recurse -ErrorAction SilentlyContinue
          }
          # Keep saves, settings and the stored ROM next to the exe for a
          # drop-in test folder. Delete portable.txt to use LocalAppData.
          Set-Content -Path "$dist/portable.txt" -Value ""
          # The ROM is not shipped. The launcher asks for it on first run.
          @"
          Turok 2: Recompiled

          1. Instale o Visual C++ Redistributable 2015-2022 (x64) se o Windows
             pedir DLLs da runtime.
          2. Rode Turok2Recompiled.exe.
          3. No launcher, use Carregar ROM e escolha o dump USA 1.0
             (SHA1 fb0400f21e3f043939ab56500c7b12a3231006f1).
          4. Depois disso o botao vira Jogar. Controles, Opcoes e Mods
             ficam no mesmo menu (Esc / F10 no jogo).

          portable.txt faz saves e configs morarem nesta pasta. Apague o
          arquivo se quiser o padrao em %LOCALAPPDATA%\turok2-recompiled.
          "@ | Set-Content -Encoding utf8 "$dist/LEIAME.txt"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Turok2Recompiled-windows-x64
          path: dist/
          if-no-files-found: error
